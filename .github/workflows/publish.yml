name: publish

# Builds on a release tag (context-handoff--vX.Y.Z, made by `claude plugin tag --push`) and uploads to PyPI
# with trusted publishing (OIDC). No token is stored anywhere.

on:
  push:
    tags: ["context-handoff--v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Tag matches the package version
        run: |
          v=$(python -c "import sys; sys.path.insert(0, 'src'); import context_handoff; print(context_handoff.__version__)")
          test "${GITHUB_REF_NAME}" = "context-handoff--v${v}" || { echo "tag ${GITHUB_REF_NAME} != version ${v}"; exit 1; }
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Build
        run: |
          python -m pip install build==1.6.1 twine==7.0.0
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/context-handoff
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
