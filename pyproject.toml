[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "context-handoff"
dynamic = ["version"]
description = "Keep Claude Code sessions cheap: meter cost, write a handoff note, resume after /clear"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Yauhen Bichel" }]
dependencies = []
keywords = ["claude", "claude-code", "llm", "cost", "context", "handoff"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

[project.scripts]
context-handoff = "context_handoff.__main__:main"

[project.urls]
Homepage = "https://github.com/YauhenBichel/context-handoff"
Changelog = "https://github.com/YauhenBichel/context-handoff/blob/main/CHANGELOG.md"
Issues = "https://github.com/YauhenBichel/context-handoff/issues"

[tool.setuptools.dynamic]
version = { attr = "context_handoff.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
